name: Validate K-Law Dictionary
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/index.js
      - run: node -e "JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8'))"
